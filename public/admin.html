<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel</title><style>body{font-family:system-ui;background:#f3f6f4;padding:28px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between}button{background:#28594c;color:#fff;border:0;padding:10px 16px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}th{background:#28594c;color:#fff}</style></head><body><main class="wrap"><div class="top"><h1>Avaliações recebidas</h1><button id="sair">Sair</button></div><p id="status"></p><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Nota</th><th>Limpeza</th><th>Atendimento</th><th>Recomenda</th><th>Comentário</th><th>Data</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/respostas');if(r.status===401)return location='/login.html';const d=await r.json();status.textContent=d.length+' resposta(s)';rows.innerHTML=d.map(x=>`<tr><td>${x.id}</td><td>${x.nota}</td><td>${x.limpeza}</td><td>${x.atendimento}</td><td>${esc(x.recomendaria)}</td><td>${esc(x.comentario)}</td><td>${esc(x.criado_em)}</td></tr>`).join('')}sair.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location='/login.html'};load()</script></body></html>
