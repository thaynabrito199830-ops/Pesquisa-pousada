<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel</title><style>body{font-family:system-ui;background:#f3f6f4;padding:28px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between}.tabs{display:flex;gap:8px;margin:20px 0}button{background:#28594c;color:#fff;border:0;padding:10px 16px;border-radius:8px}section{display:none}section.on{display:block}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}th{background:#28594c;color:#fff}</style></head><body><main class="wrap"><div class="top"><h1>Painel administrativo</h1><button id="sair">Sair</button></div><div class="tabs"><button onclick="show('avaliacoes')">Avaliações</button><button onclick="show('acessos')">Acessos</button></div><section id="avaliacoes" class="on"><h2>Avaliações</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Identificação</th><th>Nota</th><th>Limpeza</th><th>Atendimento</th><th>Recomenda</th><th>Comentário</th><th>Data</th></tr></thead><tbody id="rr"></tbody></table></div></section><section id="acessos"><h2>Acessos</h2><table><thead><tr><th>ID</th><th>Identificação</th><th>Data</th></tr></thead><tbody id="ra"></tbody></table></section></main><script>const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}async function get(u){const r=await fetch(u);if(r.status===401){location='/login.html';return[]}return r.json()}async function load(){const[r,a]=await Promise.all([get('/api/respostas'),get('/api/acessos')]);rr.innerHTML=r.map(x=>`<tr><td>${x.id}</td><td>${esc(x.identificacao)}</td><td>${x.nota}</td><td>${x.limpeza}</td><td>${x.atendimento}</td><td>${esc(x.recomendaria)}</td><td>${esc(x.comentario)}</td><td>${esc(x.criado_em)}</td></tr>`).join('');ra.innerHTML=a.map(x=>`<tr><td>${x.id}</td><td>${esc(x.identificacao)}</td><td>${esc(x.criado_em)}</td></tr>`).join('')}sair.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location='/login.html'};load()</script></body></html>
