<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso à pesquisa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: linear-gradient(rgba(238,77,45,.78), rgba(255,112,67,.78)), repeating-linear-gradient(135deg, rgba(255,255,255,.08) 0 20px, transparent 20px 40px), #ee4d2d;
    }
    .login-container { background: #fff; width: 380px; padding: 40px 32px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .logo { display: block; width: 120px; height: auto; margin: 0 auto 25px; }
    h2 { text-align: center; margin-bottom: 10px; }
    .notice { text-align: center; color: #5f6368; font-size: 13px; line-height: 1.4; margin-bottom: 25px; }
    .input-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #555; }
    input { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 6px; }
    input:focus { outline: 2px solid #1a73e8; border-color: transparent; }
    .btn { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .btn:hover { background: #1557b0; }
  </style>
</head>
<body>
  <div class="login-container">
    <img class="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Logo">
    <h2>Acesso à Pesquisa</h2>
    <p class="notice">Preencha seus dados para iniciar a pesquisa.</p>
    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="nome">Nome Completo</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required>
      </div>
      <div class="input-group">
        <label for="apelido">Apelido</label>
        <input id="apelido" name="apelido" type="text" autocomplete="nickname" required>
      </div>
      <button class="btn" type="submit">Entrar na pesquisa</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const nome = document.getElementById('nome');
    const apelido = document.getElementById('apelido');
    form.addEventListener('submit', function(event) {
      event.preventDefault();
      if (!nome.value.trim()) { alert('Informe seu nome completo.'); nome.focus(); return; }
      if (!apelido.value.trim()) { alert('Informe seu apelido.'); apelido.focus(); return; }
      form.reset();
      window.location.assign('https://pesquisa-pousada.onrender.com/entrar.html');
    });
  </script>
</body>
</html>
