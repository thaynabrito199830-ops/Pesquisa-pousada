<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Satisfação Indicadores</title>

  <style>
    body {
      font-family: system-ui;
      background: #e5eee9;
      margin: 0;
      padding: 30px;
      color: #17352d;
    }

    .card {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 34px;
      border-radius: 20px;
    }

    h1 {
      font-family: Georgia, serif;
    }

    fieldset {
      border: 0;
      margin: 22px 0;
      padding: 0;
    }

    .op {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .op label {
      border: 1px solid #ccd6d1;
      padding: 10px 16px;
      border-radius: 9px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      box-sizing: border-box;
      padding: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #28594c;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .msg {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <form class="card" id="form">
    <h1>Pesquisa de satisfação</h1>

    <fieldset>
      <legend>Nota geral *</legend>
      <div class="op" id="nota"></div>
    </fieldset>

    <fieldset>
      <legend>Agilidade *</legend>
      <div class="op" id="limpeza"></div>
    </fieldset>

    <fieldset>
      <legend>Atendimento *</legend>
      <div class="op" id="atendimento"></div>
    </fieldset>

    <fieldset>
      <legend>Resolvido? *</legend>

      <div class="op">
        <label>
          <input
            type="radio"
            name="recomendaria"
            value="sim"
            required
          >
          Sim
        </label>

        <label>
          <input
            type="radio"
            name="recomendaria"
            value="nao"
          >
          Não
        </label>
      </div>
    </fieldset>

    <label for="comentario">
      Comentário opcional
    </label>

    <textarea
      id="comentario"
      maxlength="1000"
    ></textarea>

    <button type="submit">
      Enviar avaliação
    </button>

    <div id="msg" class="msg"></div>
  </form>

  <script>
    const form =
      document.getElementById('form');

    const comentario =
      document.getElementById('comentario');

    const msg =
      document.getElementById('msg');

    fetch('/api/participante')
      .then(resposta => resposta.json())
      .then(participante => {
        if (!participante.identificado) {
          window.location.href = '/entrar.html';
        }
      })
      .catch(() => {
        window.location.href = '/entrar.html';
      });

    for (
      const id of [
        'nota',
        'limpeza',
        'atendimento'
      ]
    ) {
      for (let numero = 1; numero <= 5; numero++) {
        document
          .getElementById(id)
          .insertAdjacentHTML(
            'beforeend',
            `
              <label>
                <input
                  type="radio"
                  name="${id}"
                  value="${numero}"
                  required
                >
                ${numero}
              </label>
            `
          );
      }
    }

    form.addEventListener(
      'submit',
      async event => {
        event.preventDefault();

        const dados =
          new FormData(form);

        try {
          const resposta =
            await fetch('/api/respostas', {
              method: 'POST',

              headers: {
                'Content-Type': 'application/json'
              },

              body: JSON.stringify({
                nota: Number(dados.get('nota')),
                limpeza: Number(
                  dados.get('limpeza')
                ),
                atendimento: Number(
                  dados.get('atendimento')
                ),
                recomendaria:
                  dados.get('recomendaria'),
                comentario:
                  comentario.value.trim()
              })
            });

          const resultado =
            await resposta.json();

          msg.textContent =
            resultado.mensagem;

          if (resposta.ok) {
            form.reset();
          }
        } catch (erro) {
          console.error(erro);

          msg.textContent =
            'Não foi possível enviar a avaliação.';
        }
      }
    );
  </script>
</body>
</html>
