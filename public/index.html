<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesquisa Brisa Serena</title><style>body{font-family:system-ui;background:#e5eee9;margin:0;padding:30px;color:#17352d}.card{max-width:700px;margin:auto;background:#fff;padding:34px;border-radius:20px}h1{font-family:Georgia,serif}fieldset{border:0;margin:22px 0;padding:0}.opcoes{display:flex;gap:10px;flex-wrap:wrap}.opcoes label{border:1px solid #ccd6d1;padding:10px 16px;border-radius:9px}textarea{width:100%;min-height:110px;box-sizing:border-box;padding:12px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#28594c;color:#fff;font-weight:700}.msg{margin-top:15px}</style></head><body><form class="card" id="form"><small>POUSADA FICTÍCIA</small><h1>Pesquisa de satisfação</h1><p>Conte como foi sua experiência.</p><fieldset><legend>Nota geral *</legend><div class="opcoes" id="nota"></div></fieldset><fieldset><legend>Limpeza *</legend><div class="opcoes" id="limpeza"></div></fieldset><fieldset><legend>Atendimento *</legend><div class="opcoes" id="atendimento"></div></fieldset><fieldset><legend>Recomendaria? *</legend><div class="opcoes"><label><input type="radio" name="recomendaria" value="sim" required> Sim</label><label><input type="radio" name="recomendaria" value="nao"> Não</label></div></fieldset><p><label>Comentário opcional<br><textarea id="comentario" maxlength="1000"></textarea></label></p><button>Enviar avaliação</button><div class="msg" id="msg"></div></form><script>for(const id of ['nota','limpeza','atendimento'])for(let n=1;n<=5;n++)document.getElementById(id).insertAdjacentHTML('beforeend',`<label><input type="radio" name="${id}" value="${n}" required> ${n}</label>`);form.onsubmit=async e=>{e.preventDefault();const d=new FormData(form),r=await fetch('/api/respostas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nota:+d.get('nota'),limpeza:+d.get('limpeza'),atendimento:+d.get('atendimento'),recomendaria:d.get('recomendaria'),comentario:comentario.value})}),j=await r.json();msg.textContent=j.mensagem;if(r.ok)form.reset()}</script></body></html>
