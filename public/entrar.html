<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar na pesquisa</title><style>body{margin:0;font-family:system-ui;background:#e5eee9;display:grid;place-items:center;min-height:100vh;color:#17352d}.card{width:min(430px,88vw);background:#fff;padding:36px;border-radius:20px;box-shadow:0 18px 50px #244b3e33}h1{font-family:Georgia,serif}label{display:block;margin-top:18px;font-weight:700}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:8px;border-radius:9px;font:inherit}input{border:1px solid #ccd6d1}button{border:0;background:#28594c;color:#fff;font-weight:700}.aviso{font-size:13px;color:#63736d}.msg{color:#a22}</style></head><body><form class="card" id="f"><small>POUSADA BRISA SERENA</small><h1>Entrar na pesquisa</h1><p>Informe um nome, apelido ou e-mail.</p><label>Identificação<input id="identificacao" maxlength="120" required></label><p class="aviso">Não use senha. A identificação e o horário serão registrados e visíveis ao administrador.</p><button>Continuar</button><div id="m" class="msg"></div></form><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/entrada',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identificacao:identificacao.value})}),j=await r.json();r.ok?location='/':m.textContent=j.mensagem}</script></body></html>
