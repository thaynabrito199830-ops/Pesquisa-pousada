<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso à Pesquisa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;

    background:
    linear-gradient(rgba(238,77,45,.85),rgba(255,112,67,.85)),
    repeating-linear-gradient(
        135deg,
        rgba(255,255,255,.05) 0 20px,
        transparent 20px 40px
    ),
    #ee4d2d;
}

.card{
    width:380px;
    background:#f3f3f3;
    border-radius:14px;
    padding:40px 32px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
    display:block;
    width:140px;
    margin:0 auto 25px;
}

h1{
    text-align:center;
    font-size:20px;
    margin-bottom:12px;
}

.sub{
    text-align:center;
    color:#555;
    font-size:14px;
    margin-bottom:24px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#444;
}

input{
    width:100%;
    height:42px;
    padding:10px;
    border:1px solid #d0d0d0;
    border-radius:6px;
    margin-bottom:18px;
}

button{
    width:100%;
    height:42px;
    border:none;
    border-radius:6px;
    background:#1a73e8;
    color:#fff;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#1557b0;
}

.msg{
    margin-top:10px;
    text-align:center;
    color:#c62828;
}
</style>
</head>

<body>

<form class="card" id="f">

<img
class="logo"
src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png"
alt="Google">

<h1>Acesso à Pesquisa</h1>

<p class="sub">
Preencha seus dados para iniciar a pesquisa.
</p>

<label>Nome Completo</label>
<input id="nome" maxlength="120" required>

<label>Apelido</label>
<input id="apelido" maxlength="80" required>

<button>
Entrar na pesquisa
</button>

<div id="m" class="msg"></div>

</form>

<script>

f.onsubmit = async e => {

    e.preventDefault();

    const r = await fetch('/api/entrada', {

        method:'POST',

        headers:{
            'Content-Type':'application/json'
        },

        body:JSON.stringify({
            nome:nome.value.trim(),
            apelido:apelido.value.trim()
        })

    });

    const j = await r.json();

    if(r.ok){
        location='/';
    }else{
        m.textContent=j.mensagem;
    }

};

</script>

</body>
</html>
`
