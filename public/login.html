<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login administrativo</title><style>body{margin:0;font-family:system-ui;background:#e5eee9;display:grid;place-items:center;min-height:100vh}.card{width:min(390px,88vw);background:#fff;padding:36px;border-radius:20px}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:8px}label{display:block;margin-top:16px}button{background:#28594c;color:#fff;border:0}</style></head><body><form class="card" id="f"><h1>Área administrativa</h1><label>Usuário<input id="u" required></label><label>Senha<input id="s" type="password" required></label><button>Entrar</button><p id="m"></p></form><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:u.value,senha:s.value})}),j=await r.json();r.ok?location='/admin.html':m.textContent=j.mensagem}</script></body></html>
